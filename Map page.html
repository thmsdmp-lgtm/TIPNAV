<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Map</title>
  <link rel="stylesheet" href="hstyle.css">
</head>
<body class="map-body">

  <div class="map-screen-container">

    <!-- SEARCH BAR -->
    <div class="map-header-float">
      <div class="map-search-bar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#798099" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Search for places..">
      </div>
    </div>

    <!-- MAP BG PLACEHOLDER-->
    <div class="map-placeholder-area">
      <div class="placeholder-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555e92" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>3D Campus Map Area</span>
      </div>
    </div>

    <!-- ACTION BUTTON SA LEFT-->
    <button class="floating-circle-btn btn-left" aria-label="Center Map">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>

    <!-- ACTION BUTTON SA RIGHT -->
    <button class="floating-circle-btn btn-right" aria-label="Current Location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2">
        <circle cx="12" cy="12" r="7"></circle>
        <line x1="12" y1="1" x2="12" y2="5"></line>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="1" y1="12" x2="5" y2="12"></line>
        <line x1="19" y1="12" x2="23" y2="12"></line>
        <circle cx="12" cy="12" r="2" fill="#222"></circle>
      </svg>
    </button>

    <!-- YUNG PLACE BANNER SA BOTTOM PART-->
    <div class="map-place-card-wrap">
      <div class="map-preview-card">
        <div class="map-preview-thumb">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#4d57c8" stroke-width="1.8">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <div class="map-preview-info">
          <h3>PlaceName</h3>
          <p>place description info</p>
          <a href="place.html?name=PlaceName&loc=Campus Facility" class="btn-route-pill">Show Route</a>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <nav class="footer-nav" aria-label="Bottom Navigation">
  <!-- Home Tab -->
  <a href="index.html" class="nav-link" id="nav-home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    </svg>
    <span class="nav-text">Home</span>
  </a>

  <!-- Map Tab -->
  <a href="Map%20page.html" class="nav-link" id="nav-map">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
      <line x1="8" y1="2" x2="8" y2="18"></line>
      <line x1="16" y1="6" x2="16" y2="22"></line>
    </svg>
    <span class="nav-text">Map</span>
  </a>

  <!-- Categories Tab -->
  <a href="Category.html" class="nav-link" id="nav-category">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    <span class="nav-text">Categories</span>
  </a>
</nav>

  </div>

<script src="app.js"></script>

</body>
</html>
