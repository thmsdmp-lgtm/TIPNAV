<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Navigation</title>
  <link rel="stylesheet" href="hstyle.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">
	
      <div>
        <h1>Explore</h1>
        <p>Discover amazing places around you</p>
      </div>
    <!-- PF BUTTON AT TOP RIGHT -->
      <button class="profile-btn" aria-label="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4d57c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle></svg>
      </button>
	  
    </div>

    <!-- SEARCH BOX -->
<a href="search.html" class="search-box open-search-trigger" style="text-decoration: none; display: flex; align-items: center; cursor: pointer;">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d93aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <input type="text" placeholder="Search for places.." readonly style="cursor: pointer; pointer-events: none;">
</a>

    <!-- HERO BOX FOR 3D MAP PREVIEW AND DIRECTORY -->
    <div class="hero-card">
	
      <div class="hero-preview">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9da9db" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line></svg>
      </div>
      <div class="hero-bar">
        <div>
          <h3>TIP Campus</h3>
          <p>Navigate and Explore the campus in 3D</p>
        </div>
        <button type="button" onclick="window.location.href='Map%20page.html'">Open map &gt;</button>
      </div>
	  
    </div>

    <!-- SUGGESTIONS -->
    <div class="section-head">
      <h2>Suggested Places</h2>
      <a href="search.html" class="see-all-link">See all</a>
    </div>

    <div class="scroll-row">
      <!-- DITO INPUT NG SUGGESTED PLACES -->

      <!-- CARD 1 -->
      <a href="places.html?id=placeh1" class="place-card">
        <div class="place-top" data-place-id="placeh1">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#525bc2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="place-bottom">
          <h4>PH 1</h4>
          <p>PH 1 LOC</p>
        </div>
      </a>

      <!-- CARD 2 -->
      <a href="places.html?id=placeh2" class="place-card">
        <div class="place-top" data-place-id="placeh2">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#525bc2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="place-bottom">
          <h4>PH 2</h4>
          <p>PH 2 LOC</p>
        </div>
      </a>

      <!-- CARD 3 -->
      <a href="places.html?id=placeh3" class="place-card">
        <div class="place-top" data-place-id="placeh3">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#525bc2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <div class="place-bottom">
          <h4>PH 3</h4>
          <p>PH 3 LOC</p>
        </div>
      </a>

    </div>

    <!-- CATEGORIES -->
<div class="categories-section">
  <div class="categories-section-head">
    <h3>Categories</h3>
    <a href="Category.html" class="see-all-link">See all</a>
  </div>

  <div class="category-quick-row">

    <div class="category-quick-item">
      <div class="category-icon-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1a1e38">
          <path d="M6 22h12a2 2 0 0 0 1.73-3L14 8.5V4h1a1 1 0 0 0 0-2H9a1 1 0 0 0 0 2h1v4.5L4.27 19A2 2 0 0 0 6 22z"></path>
        </svg>
      </div>
      <span class="category-quick-label">Labs</span>
    </div>

    <div class="category-quick-item">
      <div class="category-icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1e38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <span class="category-quick-label">Rooms</span>
    </div>

    <div class="category-quick-item">
      <div class="category-icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1e38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="category-quick-label">Offices</span>
    </div>

    <div class="category-quick-item">
      <div class="category-icon-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1e38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
      </div>
      <span class="category-quick-label">Finance</span>
    </div>

  </div>
</div>

    <!-- HELP BOX-->
<a href="search.html" class="cant-find-banner">
  <div class="cant-find-text">
    <h4>Can't find a place?</h4>
    <p>Let's find a place together</p>
  </div>
  <span class="btn-search-pill">Search Now</span>
</a>

    <!-- FOOTER -->
    <nav class="footer-nav" aria-label="Bottom Navigation">
	
  <!-- Home Tab -->
  <a href="index.html" class="nav-link" id="nav-home">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    </svg>
    <span class="nav-text">Home</span>
  </a>

  <!-- Map Tab -->
  <a href="Map%20page.html" class="nav-link" id="nav-map">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
      <line x1="8" y1="2" x2="8" y2="18"></line>
      <line x1="16" y1="6" x2="16" y2="22"></line>
    </svg>
    <span class="nav-text">Map</span>
  </a>

  <!-- Categories Tab -->
  <a href="Category.html" class="nav-link" id="nav-category">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    <span class="nav-text">Categories</span>
  </a>
</nav>

  </div>
  
<script src="app.js"></script>

</body>
</html>
