<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Places</title>
  <link rel="stylesheet" href="hstyle.css">
</head>
<body class="map-body">

  <div class="search-screen-container">

    <!-- BACK BUTTON TAS SEARCH BAR -->
	<!-- NOTE DI GUMAGANA YUNG BACK BUTTON IF DI NANGGALING SA OTHER PAGES -->
    <div class="search-header-row">
      <button class="search-back-btn" onclick="history.back()" aria-label="Go Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="search-input-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8d93aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="liveSearchInput" placeholder="Search for places.." autofocus>
      </div>
    </div>

    <!-- Search Results Fee+d -->
   <div class="search-results-list" id="searchResults">
  <!-- AUTOMATED NA SA JAVASCRIPT -->
</div>

  </div>

  <script src="app.js"></script>
</body>
</html>
